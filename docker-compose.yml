# ==============================================================================
# bookride-releases - 2.3 Observability: Elasticsearch 8 + Kibana
# ==============================================================================
# Start with:   ./start.sh        (checks .env and the ports, then "up --wait";
#                                  when the start fails everything is stopped)
# Stop with:    docker compose down          (add -v to also delete the data)
#
# - Elasticsearch: single node, security ENABLED (login required).
# - Kibana: same Docker network, connects with the built-in account
#   kibana_system (NOT the elastic superuser).
# - setup: one-shot job that gives kibana_system its password, then exits.
# - Passwords and host ports come from .env only (never written here).
# - Host ports are published on 127.0.0.1 only (not reachable from the network).
# ==============================================================================

networks:
  bookride-net:
    driver: bridge

volumes:
  es_data:

services:
  # ---------------------------------------------------------------------------
  # 1. Elasticsearch (single node, security enabled)
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: bookride-elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.name=bookride
      - xpack.security.enabled=true            # login required
      - xpack.security.http.ssl.enabled=false  # plain HTTP inside the lab network
      - xpack.license.self_generated.type=basic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}   # password of the "elastic" superuser
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ports:
      - "127.0.0.1:${ES_PORT_EXPOSE}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - bookride-net
    healthcheck:
      # healthy = the cluster answers an AUTHENTICATED request with green or yellow
      test: ["CMD-SHELL", "curl -s -u \"elastic:$${ELASTIC_PASSWORD}\" http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------------
  # 2. setup: sets the password of kibana_system, then exits (one-shot job)
  # ---------------------------------------------------------------------------
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: bookride-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    networks:
      - bookride-net
    command: >
      bash -c '
        echo "Setting the password of kibana_system ...";
        for try in $$(seq 1 30); do
          if curl -s -X POST -u "elastic:$${ELASTIC_PASSWORD}" -H "Content-Type: application/json" http://elasticsearch:9200/_security/user/kibana_system/_password -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" | grep -q "^{}"; then
            echo "kibana_system password set."; exit 0;
          fi;
          sleep 5;
        done;
        echo "ERROR: could not set the kibana_system password"; exit 1;
      '

  # ---------------------------------------------------------------------------
  # 3. Kibana (connects as kibana_system)
  # ---------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: bookride-kibana
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "127.0.0.1:${KIBANA_PORT_EXPOSE}:5601"
    networks:
      - bookride-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601/api/status | grep -q 'HTTP/1.1 200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
